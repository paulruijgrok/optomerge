# Example optomerge configuration.
#
#   python run_optomerge.py --config optomerge.example.toml
#
# Every section and key is optional -- only the keys you set are applied; the
# rest keep their defaults. Any explicit CLI flag overrides the value here, and
# multiple --config files layer left-to-right. Works on Python 3.9+ (uses stdlib
# tomllib on 3.11+, or the tomli backport, installed automatically, on 3.9/3.10).
#
# Each run also writes its fully-resolved config to <output>/run_config.toml,
# which you can pass straight back in with --config to reproduce that run.

[io]
input = "test_data"                    # root directory of raw movies (scanned recursively)
output = "output_temp"                 # output root; input folder structure is mirrored
suffix = "_aligned"                    # inserted before the .tif extension of each output
overwrite = false                      # re-process files whose output already exists
rgb_bitdepth = 8                       # RGB output bit depth: 8 (compact, fixed-range display) | 16

[channels]
channel_order = "auto"                 # auto | top_green_fils_bottom_red_heads | top_red_heads_bottom_green_fils
segmentation = "row_profile"           # row_profile (robust rectangles) | line_search (legacy k-means)
# projection_frames = 200              # frames used for detection/alignment (unset = all frames)

[alignment]
method = "phase"                       # registration algorithm:
                                       #   phase   = FFT phase correlation (default, general purpose)
                                       #   feature = head-to-filament distance minimisation, tailored
                                       #             to point-vs-line channels (heads on filaments).
                                       #             See "Feature-distance registration" in the README.
feature_frames = 60                    # (feature) sampled raw frames used to fit the alignment
head_sigma = 3.0                       # (feature) head threshold: mean + N*std of the moving channel
filament_sigma = 2.0                   # (feature) filament threshold: mean + N*std of the reference
head_min_area = 4                      # (feature) drop head blobs smaller than this (px) — noise
head_max_area = 60                     # (feature) drop head blobs larger than this (px) — not point-like
filament_min_area = 20                 # (feature) despeckle: drop filament-mask blobs smaller than this (px)
distance_cap = 6.0                     # (feature) heads farther than this (px) from any filament are
                                       #   treated as orphans (red-only / undetected) and don't bias the fit
deweight_stuck = false                 # (feature) weight heads by 1/persistence so a stuck object counts
                                       #   once, not once-per-frame (restores field coverage)
stuck_radius = 2.0                     # (feature) px within which cross-frame detections are the same stuck object
use_scrub = false                      # align on upsampled scrub images (sub-pixel accuracy)
upscale = 4                            # scrub upscaling factor when use_scrub = true
init_rot = 0.0                         # initial guess: rotation (radians)
init_s1 = 1.0                          # initial guess: scale (axis 1)
init_s2 = 1.0                          # initial guess: scale (axis 2)
max_shift = 0.0                        # constrain translation to +/- px (0 = unconstrained);
                                       #   set ~30 when the true inter-channel shift is small
fit_scale_rotation = true              # true = search rotation+scale; false = translation only
                                       #   (more stable for fixed optics like an OptoSplit)

[calibration]
mode = "single"                        # single (one whole-movie projection) | robust (best-of-N over chunks)
chunk_size = 400                       # frames per projection block (robust mode)
min_candidates = 10                    # passing candidates before picking the best (robust mode)
max_trials = 30                        # max blocks tried before giving up (robust mode)

[acceptance]
# Reject nonsensical channel detections / alignments (ported from alignRGB.m).
min_size_row_frac = 0.7                # min reference-channel height / image height * n_channels
min_size_col_frac = 0.85               # min reference-channel width / image width
max_translation_px = 25.0              # max |t1|/|t2| between channels (pixels)
max_rotation_deg = 2.0                 # max |rotation| between channels (degrees)
max_scale_pct = 2.0                    # max scale deviation |s - 1| * 100 (percent)
size_weight = 1.0                      # scoring weight: channel size
cross_corr_weight = 3.0                # scoring weight: cross-correlation peak
cross_corr_norm = 0.1                  # normalisation for the cross-correlation peak

[grouping]
# How movies are partitioned into sets that share one alignment (only used when
# runtime.reuse_alignment != "none").
by = "run"                             # run (whole batch) | token (filename marker) | folder
token_pattern = "_ch\\d\\d_"           # regex marker for by = "token" (channel/date)

[processing]
bg_radius = 10                         # background-subtraction structuring-element radius
bunch_size = 100                       # frames held/processed per block (caps memory; ~100 like MATLAB)
norm_projection = "max"                # projection for normalisation limits: max (avoids saturating moving filaments) | mean
norm_exclude = 0.0                     # extra percentile excluded when setting limits (0 = min/max after median-despeckle)

[runtime]
reuse_alignment = "none"               # none | first | <reference file>: reuse layout+transform across the batch
verbose = false
dry_run = false                        # list files that would be processed, then exit
