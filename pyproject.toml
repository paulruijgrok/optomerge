[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optomerge"
version = "0.1.0"
description = "Excise and register multichannel sub-images from raw fluorescence movie stacks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Paul Ruijgrok", email = "paulruijgrok@gmail.com" }]
keywords = ["image registration", "fluorescence microscopy", "TIRF", "channel alignment"]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-image>=0.19",
    "tifffile>=2022.5",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]
cv2 = ["opencv-python>=4.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["optomerge*"]

[tool.pytest.ini_options]
# Collect only the test suite, not the root-level CLI scripts (run_optomerge.py,
# test_pipeline.py) — the latter matches test_*.py but is an entry-point script,
# not a test module.
testpaths = ["tests"]
